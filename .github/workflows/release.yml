# v1.2.3 같은 태그를 푸시하면 테스트 → NuGet 배포 → GitHub 릴리즈 생성
# 또는 Actions 탭에서 직접 실행(workflow_dispatch)하고 버전을 입력하면, 선택한 브랜치의 커밋에 v(버전) 태그와 릴리즈를 만듦
# NuGet 배포는 Trusted Publishing(OIDC)을 사용하므로 API 키 시크릿이 필요 없음
# (nuget.org의 Trusted Publishing 정책: 저장소 jyunrcaea/Jyuno, 워크플로우 release.yml, 환경 production)
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '배포할 버전 (예: 1.4.0)'
        required: true

permissions:
  contents: write  # GitHub 릴리즈 생성
  id-token: write  # NuGet Trusted Publishing용 OIDC 토큰 발급

jobs:
  release:
    runs-on: ubuntu-latest
    # Trusted Publishing 정책의 Environment와 같아야 함
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 버전 읽기 (태그 또는 입력)
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::버전 '$version'은 1.2.3 또는 1.2.3-beta.1 형식이어야 합니다."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 테스트
        run: dotnet test Jyuno.Tests -c Release

      - name: 패키지 만들기
        run: dotnet pack Jyuno.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }} -p:ContinuousIntegrationBuild=true

      # OIDC 토큰으로 1시간짜리 임시 API 키를 받음 (만료되지 않도록 배포 직전에 실행)
      - name: NuGet 로그인 (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: jyunrcaea  # nuget.org 프로필 이름 (이메일 아님)

      - name: NuGet에 배포
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub 릴리즈 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          # 태그가 없다면(workflow_dispatch) 지금 커밋에 v(버전) 태그를 만듦
          gh release create "v$VERSION" artifacts/*.nupkg artifacts/*.snupkg \
            --target "$GITHUB_SHA" --title "Jyuno $VERSION" --generate-notes $prerelease
